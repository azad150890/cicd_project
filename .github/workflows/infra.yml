name: Terraform Infra

on:
  push:
    branches: [dev, qa, main]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Debug OIDC context
        run: |
          echo "repo: ${{ github.repository }}"
          echo "ref: ${{ github.ref }}"

      - uses: hashicorp/setup-terraform@v2

      - name: Select env
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then echo "ENV=dev" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF}" == "refs/heads/qa" ]]; then echo "ENV=qa" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then echo "ENV=prod" >> $GITHUB_ENV; fi

      - name: Terraform Init
        run: terraform init
        working-directory: infra/envs/${{ env.ENV }}

      - name: Terraform Plan
        run: terraform plan
        working-directory: infra/envs/${{ env.ENV }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: infra/envs/${{ env.ENV }}