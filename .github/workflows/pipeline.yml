name: Enterprise CI/CD (Infra + App)

on:
  push:
    branches: [dev, qa, main]

permissions:
  id-token: write
  contents: read

# -----------------------------
# 1. GLOBAL SETUP (ENV MAPPING)
# -----------------------------
jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env.outputs.env }}
      app: ${{ steps.env.outputs.app }}
      run_infra: ${{ steps.filter.outputs.infra }}
      run_app: ${{ steps.filter.outputs.app }}

    steps:
      - uses: actions/checkout@v3

      # -------------------------
      # ENV SELECTION (CLEAN)
      # -------------------------
      - name: Set environment
        id: env
        run: |
          case "${GITHUB_REF}" in
            refs/heads/dev)
              echo "env=dev" >> $GITHUB_OUTPUT
              echo "app=app-dev-xyz123" >> $GITHUB_OUTPUT
              ;;
            refs/heads/qa)
              echo "env=qa" >> $GITHUB_OUTPUT
              echo "app=app-qa-xyz123" >> $GITHUB_OUTPUT
              ;;
            refs/heads/main)
              echo "env=prod" >> $GITHUB_OUTPUT
              echo "app=app-prd-xyz123" >> $GITHUB_OUTPUT
              ;;
          esac

      # -------------------------
      # CLEAN PATH DETECTION
      # -------------------------
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'
            app:
              - 'app/**'    


# -----------------------------
# 2. TERRAFORM (INFRA ONLY)
# -----------------------------
  terraform:
    needs: setup
    if: needs.setup.outputs.run_infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init
        working-directory: infra/envs/${{ needs.setup.outputs.env }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: infra/envs/${{ needs.setup.outputs.env }}


# -----------------------------
# 3. WAIT FOR INFRA
# -----------------------------
  wait:
    needs: [setup, terraform]
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for Web App
        run: |
          APP=${{ needs.setup.outputs.app }}

          echo "Waiting for $APP ..."

          for i in {1..30}; do
            az webapp show --name $APP --resource-group rg-${{ needs.setup.outputs.env }} && exit 0
            echo "Not ready yet..."
            sleep 10
          done

          exit 1


# -----------------------------
# 4. APP DEPLOYMENT (APP ONLY)
# -----------------------------
  deploy:
    needs: [setup, wait]
    if: needs.setup.outputs.run_app == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build App
        run: dotnet publish app/src -c Release -o publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ needs.setup.outputs.app }}
          package: publish