name: Full CI/CD (Infra + App)

on:
  push:
    branches: [dev, qa, prod]

permissions:
  id-token: write
  contents: read

jobs:

# -----------------------------
# 1. DETECT ENV
# -----------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.setenv.outputs.env }}
      app: ${{ steps.setenv.outputs.app }}
      infra_changed: ${{ steps.changes.outputs.infra }}

    steps:
      - uses: actions/checkout@v3

      - name: Detect changes
        id: changes
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep infra; then
            echo "infra=true" >> $GITHUB_OUTPUT
          else
            echo "infra=false" >> $GITHUB_OUTPUT
          fi

      - name: Set environment
        id: setenv
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            echo "env=dev" >> $GITHUB_OUTPUT
            echo "app=app-dev-xyz123" >> $GITHUB_OUTPUT
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/qa" ]]; then
            echo "env=qa" >> $GITHUB_OUTPUT
            echo "app=app-qa-xyz123" >> $GITHUB_OUTPUT
          fi

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
            echo "app=app-prd-xyz123" >> $GITHUB_OUTPUT
          fi


# -----------------------------
# 2. INFRA (TERRAFORM)
# -----------------------------
  terraform:
    needs: setup
    if: needs.setup.outputs.infra_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init
        working-directory: infra/envs/${{ needs.setup.outputs.env }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: infra/envs/${{ needs.setup.outputs.env }}


# -----------------------------
# 3. WAIT FOR INFRA
# -----------------------------
  wait_for_infra:
    needs: [setup, terraform]
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for Web App
        run: |
          APP=${{ needs.setup.outputs.app }}

          echo "Waiting for $APP ..."

          for i in {1..30}; do
            az webapp show --name $APP --resource-group rg-${{ needs.setup.outputs.env }} && exit 0
            echo "Not ready yet..."
            sleep 10
          done

          echo "Web App not ready"
          exit 1


# -----------------------------
# 4. BUILD + DEPLOY APP
# -----------------------------
  deploy_app:
    needs: [setup, wait_for_infra]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build App
        run: dotnet publish app/src -c Release -o publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ needs.setup.outputs.app }}
          package: publish