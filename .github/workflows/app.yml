name: Deploy App

on:
  push:
    branches: [dev, qa, main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build App
        run: dotnet publish app/src -c Release -o publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select App Name
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then echo "APP=app-dev-xyz123" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF}" == "refs/heads/qa" ]]; then echo "APP=app-qa-xyz123" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then echo "APP=app-prd-xyz123" >> $GITHUB_ENV; fi

      - name: Deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.APP }}
          package: publish